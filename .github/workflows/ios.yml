name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ensure cocoapods
        run: |
          pod --version || brew install cocoapods

      - name: npm install
        run: npm install

      - name: add ios platform
        run: npx cap add ios || npx cap sync ios

      - name: sync web + config
        run: npx cap sync ios

      - name: build unsigned .app
        working-directory: ios/App
        run: |
          set -e
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath "$PWD/../../build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: package ipa
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          echo "app bundle: $APP"
          test -n "$APP"
          rm -rf Payload app.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry app.ipa Payload
          ls -la app.ipa
          unzip -l app.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: app.ipa
          if-no-files-found: error
